# Production app node with a pre-built image (no "build" on the server).
#
# PostgreSQL and Redis are external services on Server 3 (45.134.82.172).
# This compose file runs only the application container.
#
# Local (Windows/macOS/Linux):
#   docker build -t starnexus-new-api:prod .
#   docker save starnexus-new-api:prod -o starnexus-new-api.tar
#   # upload starnexus-new-api.tar to /www/wwwroot/starnexus/
#
# Server:
#   docker load -i starnexus-new-api.tar
#   docker compose -f docker-compose.prod.image.yml up -d

version: '3.4'

services:
  new-api:
    image: starnexus-new-api:prod
    container_name: xingyuapi-new-api
    restart: always
    command: --log-dir /app/logs
    env_file:
      - .env
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ./data:/data
      - ./logs:/app/logs
    environment:
      SQL_DSN: ${SQL_DSN}
      REDIS_CONN_STRING: ${REDIS_CONN_STRING}
      RESPONSES_HTTP_CONT_REDIS_WRITE_ENABLED: ${RESPONSES_HTTP_CONT_REDIS_WRITE_ENABLED:-false}
      TZ: Asia/Shanghai
      ERROR_LOG_ENABLED: "true"
      BATCH_UPDATE_ENABLED: "true"
      NODE_TYPE: ${NODE_TYPE:-master}
      NODE_NAME: ${NODE_NAME:-xingyuapi-prod-1}
      SESSION_SECRET: ${SESSION_SECRET}
      CRYPTO_SECRET: ${CRYPTO_SECRET}
      TRUSTED_REDIRECT_DOMAINS: ${TRUSTED_REDIRECT_DOMAINS:-xingyuapi.com}
      SYNC_FREQUENCY: ${SYNC_FREQUENCY:-60}
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:3000/api/status | grep -o '\"success\":\\s*true' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
