# Production slave application nodes (currently verified on S2, S3, and S4): app only.
#
# PostgreSQL and Redis are external services on DB6 (67.230.183.84).
# The application uses PgBouncer on 6432 and Redis on 6379/1.
#
# Setup:
#   Verify the server-local .env points to DB6; repository .env.prod* files
#   contain historical topology and are not production sources of truth.
#   docker compose -f docker-compose.prod2.yml pull new-api
#   docker compose -f docker-compose.prod2.yml up -d --no-deps --force-recreate new-api
#
# Baota: api subdomain -> http://127.0.0.1:3000

version: '3.4'

services:
  new-api:
    image: ghcr.io/z55183980-gif/starnexus:${APP_IMAGE_TAG:-main}
    pull_policy: always
    container_name: xingyuapi-new-api
    restart: always
    command: --log-dir /app/logs
    env_file:
      - .env
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ./data:/data
      - ./logs:/app/logs
    networks:
      - xingyuapi-network
    environment:
      SQL_DSN: ${SQL_DSN}
      REDIS_CONN_STRING: ${REDIS_CONN_STRING}
      TZ: Asia/Shanghai
      ERROR_LOG_ENABLED: "true"
      BATCH_UPDATE_ENABLED: "true"
      NODE_TYPE: ${NODE_TYPE:-slave}
      NODE_NAME: ${NODE_NAME:-xingyuapi-prod-2}
      SESSION_SECRET: ${SESSION_SECRET}
      CRYPTO_SECRET: ${CRYPTO_SECRET}
      TRUSTED_REDIRECT_DOMAINS: ${TRUSTED_REDIRECT_DOMAINS:-xingyuapi.com}
      SYNC_FREQUENCY: ${SYNC_FREQUENCY:-60}
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:3000/api/status | grep -o '\"success\":\\s*true' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

networks:
  xingyuapi-network:
    external: true
    name: starnexus_xingyuapi-network
