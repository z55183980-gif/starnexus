# Production: StarNexus / new-api (Scheme A — PostgreSQL + Redis, local build)
#
# PostgreSQL and Redis are external services on Server 3 (45.134.82.172).
# This compose file runs only the application container.
#
# Setup:
#   cp .env.prod .env
#   docker compose -f docker-compose.prod.yml up -d --build
#
# Baota reverse proxy: xingyuapi.com + api.xingyuapi.com -> http://127.0.0.1:3000

version: '3.4'

services:
  new-api:
    build: .
    image: starnexus-new-api:prod
    container_name: xingyuapi-new-api
    restart: always
    command: --log-dir /app/logs
    env_file:
      - .env
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ./data:/data
      - ./logs:/app/logs
    networks:
      - xingyuapi-network
    environment:
      SQL_DSN: ${SQL_DSN}
      REDIS_CONN_STRING: ${REDIS_CONN_STRING}
      TZ: Asia/Shanghai
      ERROR_LOG_ENABLED: "true"
      BATCH_UPDATE_ENABLED: "true"
      NODE_TYPE: ${NODE_TYPE:-master}
      NODE_NAME: ${NODE_NAME:-xingyuapi-prod-1}
      SESSION_SECRET: ${SESSION_SECRET}
      CRYPTO_SECRET: ${CRYPTO_SECRET}
      TRUSTED_REDIRECT_DOMAINS: ${TRUSTED_REDIRECT_DOMAINS:-xingyuapi.com}
      SYNC_FREQUENCY: ${SYNC_FREQUENCY:-60}
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:3000/api/status | grep -o '\"success\":\\s*true' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

networks:
  xingyuapi-network:
    external: true
    name: starnexus_xingyuapi-network
