<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>登录 StarNexus 密钥管理工具</title>
<style>[hidden]{display:none!important}body{margin:0;background:#f5f7fb;color:#17212e;font:15px/1.7 system-ui,sans-serif;display:grid;min-height:100vh;place-items:center}main{max-width:410px;margin:24px;padding:28px;background:white;border:1px solid #e4e9ef;border-radius:20px}header{display:flex;gap:12px;align-items:center}img{width:46px;height:46px;object-fit:contain}h1{font-size:21px;margin:0}p{color:#536273}button,a.action{display:block;box-sizing:border-box;width:100%;border:0;border-radius:10px;padding:12px 16px;background:#12395a;color:white;font-size:15px;text-align:center;text-decoration:none;cursor:pointer}button:disabled{opacity:.5;cursor:wait}#error{color:#ad2935}small{display:block;margin-top:14px;color:#68788a}#reopen{margin-top:12px}a{color:#195b9c}</style></head>
<body><main><header><img src="/logo.png" alt="StarNexus"><h1>登录账号</h1></header><p>登录后，将授权此电脑上的 StarNexus 密钥管理工具访问并导入你的密钥。</p><p id="status" role="status">正在检查官网登录状态…</p><p id="error" role="alert"></p><button id="continue" disabled>正在检查…</button><a id="reopen" class="action" hidden>返回密钥管理工具</a><small>请保持此页面打开。账号密码仅在 dkby.com 官网输入。</small></main>
<script>
'use strict';
const params=new URLSearchParams(location.search), state=params.get('state')||'', challenge=params.get('code_challenge')||'';
const token=/^[A-Za-z0-9_-]{43}$/;
const button=document.getElementById('continue'),status=document.getElementById('status'),error=document.getElementById('error'),reopen=document.getElementById('reopen');
let user=null, waiting=false, busy=false, done=false, popup=null, expires=Date.now()+10*60*1000;
async function self(){ const uid=localStorage.getItem('uid'); if(!uid||!/^\d+$/.test(uid))return null; const r=await fetch('/api/user/self',{headers:{'New-Api-User':uid},cache:'no-store'}); const v=await r.json();return v.success?v.data:null; }
async function authorize(){if(busy||done||!user)return;busy=true;button.disabled=true;error.textContent='';try{const r=await fetch('/api/desktop/authorize',{method:'POST',headers:{'Content-Type':'application/json','New-Api-User':String(user.id)},body:JSON.stringify({state,code_challenge:challenge})});const v=await r.json();if(!v.success)throw Error(v.message||'授权失败，请重新登录');const u=new URL(v.data.callback);if(u.protocol!=='com.dkby.starnexus.keytool:'||u.host!=='auth'||u.pathname!=='/callback')throw Error('回调地址无效');done=true;reopen.href=u.href;reopen.hidden=false;status.textContent='官网登录成功，正在返回密钥管理工具。若浏览器询问，请允许打开应用。';button.hidden=true;if(popup&&!popup.closed)popup.close();location.href=u.href;}catch(e){waiting=false;error.textContent=e.message;}finally{busy=false;button.disabled=false;}}
async function check(){if(done||busy)return;if(Date.now()>expires){error.textContent='登录请求已超时，请从工具重新发起。';button.disabled=true;return;}try{user=await self();if(user){status.textContent='当前账号：'+(user.display_name||user.username);button.textContent='登录并返回工具';button.disabled=false;if(waiting)await authorize();}else{status.textContent=waiting?'请在新打开的官网页面完成登录。成功后会自动返回工具。':'请先登录 StarNexus 官网。';button.textContent=waiting?'重新打开官网登录':'官网登录并返回工具';button.disabled=false;}}catch(e){error.textContent='无法读取登录状态，请检查网络后重试';button.disabled=false;button.textContent='重试';}}
button.onclick=()=>{if(user){void authorize();return;}waiting=true;popup=window.open('/sign-in','starnexus-account-login');if(!popup){waiting=false;error.textContent='浏览器阻止了登录窗口，请允许此网站打开新窗口后重试。';return;}void check();};
if(!token.test(state)||!token.test(challenge)){error.textContent='登录请求无效，请从密钥管理工具重新发起。';status.textContent='';button.hidden=true;}else{void check();setInterval(check,2000);window.addEventListener('focus',()=>void check());}
</script></body></html>
